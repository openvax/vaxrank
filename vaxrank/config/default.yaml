# Vaxrank default configuration.
#
# Every value below mirrors the in-code default, so an empty config plus this
# file produces identical behavior to running vaxrank with no --config at all.
# Copy this file, change what you want, and pass it via:
#
#     vaxrank --config my-config.yaml ...
#
# You can also dump it any time via:
#
#     vaxrank --print-default-config > my-config.yaml
#
# Top-level sections:
#
#   epitopes           (modality-agnostic) Filter / score MHC ligand
#                      predictions: logistic IC50 / percentile-rank
#                      knobs, the topiary DSL
#                      ``filter_expr`` / ``score_expr``, and
#                      ``default_methods`` for multi-predictor inputs.
#
#   vaccine_peptides   (modality-agnostic) Per-variant antigen-window
#                      selection + the *ranking* of those windows:
#                      length, padding, ``combined_score_expr``,
#                      ``ranking_rules``,
#                      ``score_fraction_of_best``, and the
#                      antigen-design knobs that apply to every
#                      modality (``antigen_content``,
#                      ``epitopes_per_antigen``, ``candidates_per_slot``,
#                      ``min_antigen_length_aa``, ``max_antigen_length_aa``).
#                      Section name kept for back-compat with
#                      pre-mRNA configs.
#
#   peptide            Peptide-vaccine assembly + a peptide-only
#                      ``manufacturability`` sub-section
#                      (synthesis-difficulty rules + thresholds).
#
#   mrna               mRNA-vaccine assembly.
#
# Adding a new modality (e.g. ``dna:``) is a new top-level section
# that pairs with a registry entry in ``vaxrank/modalities.py``.
#
# Resolution order (highest precedence first) for any single value:
#
#   explicit CLI flag  >  per-modality section  >
#       (antigen-design knobs only) vaccine_peptides  >
#       built-in default
#
# Pre-2.19 layouts (``vaccine_constructs:`` wrapper, top-level
# ``manufacturability:``, ``vaccine_peptides.manufacturability:``)
# still load with a one-cycle DeprecationWarning — see the loader
# migrations in ``vaxrank/config/loader.py::_migrate_legacy_layout``.


epitopes:
  # ---- Scalar scoring knobs ----
  #
  # NOTE: these knobs feed the *implicit default* score expression
  # (a logistic transform of IC50 or percentile rank). When you set
  # ``score_expr`` below, that expression replaces the default
  # wholesale and the scalars below are ignored. Same for
  # ``filter_expr`` superseding ``affinity_cutoff`` /
  # ``percentile_rank_cutoff``.
  #
  # IC50 (nM) at which the logistic epitope score equals 0.5.
  logistic_midpoint: 350.0
  # Width parameter controlling the steepness of the logistic curve.
  logistic_width: 150.0
  # Drop epitopes whose normalized score falls below this threshold.
  min_score: 0.00001
  # Maximum IC50 (nM) considered. Above this, default scoring drives
  # to 0. Ignored when ``filter_expr`` is set.
  affinity_cutoff: 5000.0
  # Percentile-rank cutoff (used in scoring_mode: percentile_rank).
  # Ignored when ``filter_expr`` is set.
  percentile_rank_cutoff: 10.0
  # 'affinity' (default) | 'percentile_rank'. Picks which axis the
  # *implicit default* logistic uses; ignored when ``score_expr`` is set.
  scoring_mode: affinity

  # ---- Topiary DSL (optional, overrides scalar knobs above when set) ----
  #
  # Method-scoped access has several quote-free forms that all parse
  # identically — pick whichever reads best for you:
  #
  #   affinity[mhcflurry]       (bare identifier in brackets)
  #   ba[mhcflurry]             (alias: ba == affinity, "binding affinity")
  #   affinity['mhcflurry']     (string literal in brackets — explicit)
  #   mhcflurry_affinity        (underscore-joined, method-prefixed)
  #   mhcflurry_ba              (combine both: ba alias + method prefix)
  #
  # Versioned predictors take a second bracket arg:
  #
  #   affinity[netmhcpan, "4.1b"].value
  #
  # filter_expr is a boolean DSL string evaluated against the topiary
  # DataFrame: it drops rows wholesale before scoring. Examples:
  #   "affinity <= 500"
  #   "affinity <= 500 & percentile_rank <= 2"
  #   "affinity[mhcflurry] <= 500 | affinity[netmhcpan] <= 500"
  # filter_expr: null

  # score_expr is a numeric DSL string producing one score per
  # (peptide, allele) group. When unset, vaxrank synthesizes the default
  # logistic node from the scalar knobs above. Examples:
  #   "affinity.logistic_normalized(350, 150)"
  #   "affinity[mhcflurry].logistic_normalized(350, 150) * 0.5
  #     + affinity[netmhcpan].logistic_normalized(350, 150) * 0.5"
  #
  # NOTE on multi-model blends: averaging *transformed* scores is
  # NOT the same thing as transforming an *averaged* affinity, because
  # the logistic is non-linear. Both are reasonable; pick the one
  # that matches your intent.
  #
  #   transform-then-average (defensive, picks the "weakest credible
  #   binder" out of the panel; one bad model can drag the score down):
  #     "affinity[mhcflurry].logistic_normalized(350, 150) * 0.5
  #      + affinity[netmhcpan].logistic_normalized(350, 150) * 0.5"
  #
  #   average-then-transform (smooths the inputs first; one bad
  #   model is partially absorbed by the other):
  #     "((affinity[mhcflurry] + affinity[netmhcpan]) / 2)
  #        .logistic_normalized(350, 150)"
  #
  # The two diverge most where the panel disagrees (e.g. one model
  # at 50 nM, the other at 5000 nM) — the regime where this knob
  # actually matters.
  # score_expr: null

  # ---- Default predictor methods (only matters with multi-model inputs) ----
  # When an input source (e.g. LENS) emits multiple predictor models for the
  # same topiary Kind, unqualified DSL refs (``affinity.value``) need a
  # default method. Set per Kind below; otherwise vaxrank auto-picks
  # (mhcflurry > netmhcpan > netmhcstabpan > alphabetical).
  # default_methods:
  #   pMHC_affinity: mhcflurry
  #   pMHC_stability: netmhcstabpan
  #   pMHC_presentation: mhcflurry

  # Cap on epitope predictions retained per variant during processing
  # (set 0 to keep everything; higher values cost more time). The same
  # setting is also accepted as ``vaccine_peptides.max_epitopes_per_candidate``
  # — pick one section, never both (vaxrank errors if both are set).
  # top_epitopes_per_candidate: 1000


vaccine_peptides:
  # ---- Length / position ----
  preferred_length: 25
  min_length: 25
  max_length: 25
  padding_around_mutation: 5

  # ---- How many to keep per variant ----
  per_mutation: 1

  # ---- Score / ranking ----
  # DSL expression evaluated per VaccinePeptide to produce
  # combined_score (used to rank variants).
  # Bindings: target_epitope_score, self_epitope_score,
  # expression_score, n_alt_reads, n_ref_reads, n_overlapping_reads,
  # n_alt_reads_supporting_protein_sequence, n_mutant_amino_acids.
  # Functions: sqrt, log, log1p, exp, min, max, abs, pow.
  # The default below IS the canonical formula — there is no
  # separate mode enum. Sample alternatives:
  #   "target_epitope_score"                        (epitope-only)
  #   "n_alt_reads * target_epitope_score"          (linear in reads)
  #   "log1p(n_alt_reads) * target_epitope_score"   (log-compressed)
  combined_score_expr: "sqrt(n_alt_reads) * target_epitope_score"
  # Keep candidates whose score is at least this fraction of the best
  # before lexicographic tie-breaking.
  score_fraction_of_best: 0.99

  # Ordered list of tie-break rules (legacy default below). The
  # 'manufacturability' sentinel expands inline using the manufacturability
  # rules + thresholds in the section below. Available rules:
  # target_epitope_score, n_alt_reads, n_alt_reads_supporting,
  # self_epitope_score, n_mutant_amino_acids, mutation_distance_from_edge,
  # manufacturability.
  ranking_rules:
    - target_epitope_score
    - n_alt_reads
    - manufacturability
    - n_alt_reads_supporting
    - self_epitope_score
    - n_mutant_amino_acids
    - mutation_distance_from_edge

  # When true (legacy default), drop variants whose vaccine peptides cover
  # zero mutant epitopes from the report. Set false to keep every variant
  # for which any vaccine peptide could be assembled — useful when the
  # report itself is downstream input to an independent predictor.
  require_target_epitopes_in_variant: true


# ----------------------------------------------------------------------
# Per-modality construct-assembly sections.
#
# Default --vaccine-type is 'peptide mrna' (both modalities at once).
# Add a section per active modality. Antigen-design knobs (length
# bounds, antigen_content, epitopes_per_antigen, candidates_per_slot)
# live in ``vaccine_peptides:`` above and apply to every modality
# unless overridden inside the modality section.
#
# The peptide section also carries a ``manufacturability:``
# sub-section — solid-phase peptide synthesis rules don't apply to
# in-vivo-translated mRNA, so they're scoped to peptide.
# ``vaccine_peptides.ranking_rules``'s ``manufacturability``
# sentinel still expands using the rules + thresholds in
# ``peptide.manufacturability`` (a no-op tie-break when peptide
# isn't an active modality).
#
# Every key below is optional; the modality sub-trees ship
# uncommented because they reflect the in-code default values, but
# you can collapse a section to ``peptide: {}`` / ``mrna: {}``
# (or omit it entirely) if you'd rather inherit from the built-in
# defaults.
# ----------------------------------------------------------------------

peptide:
  # Peptide-vaccine assembly knobs. Cross-modality antigen-design
  # values live in ``vaccine_peptides:`` and apply here too unless
  # overridden in this section.
  mode: slp                            # slp | minimal_epitope | multi_epitope
  linker: G4Sx3                        # multi_epitope linker; (G4S)3 = GGGGSGGGGSGGGGS
  antigens_per_construct: 1            # SLP default; 5+ for multi_epitope
  max_constructs: 20                   # PGV-001 pool size
  n_terminal_acetyl: false             # marked in vendor order form
  c_terminal_amide: false
  scale_mg: 5.0
  purity_percent: 95.0
  counterion: TFA

  # Peptide-only synthesis-difficulty rules + thresholds. Used as a
  # tie-break when ``vaccine_peptides.ranking_rules`` references the
  # ``manufacturability`` sentinel; auto-skipped from
  # peptide-only report sections when --vaccine-type doesn't
  # include 'peptide'.
  manufacturability:
    # ---- Numeric thresholds (passed to the rule functions) ----
    max_c_terminal_hydropathy: 1.5
    min_kmer_hydropathy: 0.0
    max_kmer_hydropathy_low_priority: 1.5
    max_kmer_hydropathy_high_priority: 2.5

    # Ordered list of synthesis-difficulty rules. The order below
    # matches the legacy hard-coded tie-break order (preserved
    # byte-for-byte). 'n_terminal_methionine' is registered but not
    # in the legacy default — uncomment to enable.
    rules:
      - cysteine_count
      - cterm_hydropathy
      - max_hydropathy_high
      - difficult_n_terminal
      - c_terminal_cysteine
      - c_terminal_proline
      - n_terminal_asparagine
      # - n_terminal_methionine
      - aspartate_proline
      - max_hydropathy_low
      - min_hydropathy


mrna:
  # mRNA-vaccine assembly knobs. BioNTech FixVac (Sahin 2017) is
  # the canonical reference for these defaults.
  linker: G4Sx2                        # (G4S)2 = GGGGSGGGGS
  antigens_per_construct: 5            # FixVac canonical
  max_constructs: 2                    # FixVac 2x pentatope = 10 antigens
  max_length_nt: 4000
  signal_peptide: HLA_B
  include_mitd: true
  mitd: HLA_B
  utr_5p: HBB
  utr_3p: HBB_FI
  poly_a_length: 120
  poly_a_segmented: false              # set true for BNT162b2-style A30+linker+A70
  poly_a_first_segment: 30
  poly_a_segment_linker: GCATATGACT
  codon_species: h_sapiens
  codon_method: use_best_codon         # | match_codon_usage | harmonize_rca
  optimize_linkers: true               # per-junction linker optimization
  junction_candidates: ""              # comma-separated; "" = library default
  junction_rank_strong: 0.5            # %rank below = strong-binder hit
  junction_rank_mild: 2.0
