site_name: Vaxrank
site_description: Selection of mutated protein fragments for therapeutic personalized cancer vaccines
site_url: https://openvax.github.io/vaxrank
repo_url: https://github.com/openvax/vaxrank
repo_name: openvax/vaxrank

theme:
  name: material
  palette:
    primary: indigo
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Getting started:
    - Installation: installation.md
    - Input workflows: input-workflows.md
  - Guides:
    - Vaccine designs: vaccine-designs.md
    - Analysis outputs: outputs.md
    - Configuration: configuration.md
    - MHC binding predictors: mhc-predictors.md
    - Canine VCF and RNA: canine-vcf-workflow.md
    - Moving native datasets: native-references.md
  - Selection policies:
    - Named selection policies: selection-policies.md
    - Published comparison policies: published-policies.md
    - Patient-background comparisons: patient-background-comparisons.md
  - Experimental:
    - Antigen inputs: antigen-inputs.md
    - Isovar inputs: isovar-inputs.md
    - CTA expression inputs: design/expression-cta-inputs.md
    - Mixed antigens: mixed-antigen-design.md
    - Window exposure: core-window-exposure.md
  - How it works:
    - How Vaxrank works: how-it-works.md
    - Varcode, Isovar & Vaxrank: library-responsibilities.md
    - Isovar support: isovar-support.md
    - Evidence and provenance: unified_evidence.md
  - Development: development.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true
