<text x="32" y="47" class="kicker">OSTEOSARCOMA COMPLEX-VARIANT RESULTS</text>
<text x="32" y="84" class="title">Assembly changes what Vaxrank can claim</text>
<text x="32" y="112" class="subtitle">Actual RNA reconstruction, translation, epitope prediction, and vaccine-selection outcomes | decision matrix 4 of 4</text>
<rect x="32" y="139" width="1136" height="48" rx="8" fill="#dceefa"/>
<text x="52" y="168" class="strong">A DNA event is not an antigen. Vaxrank requires a defensible mutant protein before ranking epitopes.</text>
<text x="52" y="207" class="panel-title">VARIANT</text>
<text x="420" y="207" class="panel-title">RNA / TRANSLATION EVIDENCE</text>
<text x="1115" y="207" text-anchor="end" class="panel-title">VAXRANK OUTCOME</text>
<rect x="32" y="214" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="235" class="strong">GABBR1::SLC29A1</text><text x="52" y="252" class="footer">Cross-platform intrachromosomal rearrangement</text><text x="420" y="244" class="body">Complete ONT paths: 2 T1 + 3 T2; CDS/frame unresolved </text><text x="1138" y="244" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text><rect x="32" y="266" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="287" class="strong">OTUD7A::FMN1</text><text x="52" y="304" class="footer">Long-read-supported intrachromosomal rearrangement</text><text x="420" y="296" class="body">8 complete T2 ONT paths; 6 cell/UMI labels; CDS/frame unresolved </text><text x="1138" y="296" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text><rect x="32" y="318" width="1136" height="46" rx="7" fill="#fff2c2"/><text x="52" y="339" class="strong">H1-2 repetitive 15-nt deletion</text><text x="52" y="356" class="footer">Large in-frame deletion</text><text x="420" y="348" class="body">ONT assembly: 13 ALT, 2 OTHER; no passing target binder </text><text x="1138" y="348" text-anchor="end" class="outcome" fill="#755400">NO TARGET BINDER</text><rect x="32" y="370" width="1136" height="46" rx="7" fill="#fde9d5"/><text x="52" y="391" class="strong">ATP5MG::KMT2A</text><text x="52" y="408" class="footer">Structural variant / gene fusion</text><text x="420" y="400" class="body">One coding hypothesis; five donor-CDS-unavailable alternatives </text><text x="1138" y="400" text-anchor="end" class="outcome" fill="#8a4b16">HELD OUT</text><rect x="32" y="422" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="443" class="strong">TPST1::CRCP T2</text><text x="52" y="460" class="footer">Structural variant / gene fusion</text><text x="420" y="452" class="body">22 long reads rescue expression; CDS/frame remains unresolved </text><text x="1138" y="452" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text>
<rect x="32" y="595" width="1136" height="71" rx="8" fill="#eef3f7"/>
