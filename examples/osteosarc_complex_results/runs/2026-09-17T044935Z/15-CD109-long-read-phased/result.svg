<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#ffffff"/>
<style>
text { font-family: Inter, Helvetica, Arial, sans-serif; }
.title { font-size: 27px; font-weight: 700; fill: #17212b; }
.subtitle { font-size: 13px; fill: #445364; }
.kicker, .panel-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #526273; }
.outcome { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.body { font-size: 12px; fill: #334252; }
.strong { font-size: 13px; font-weight: 700; fill: #17212b; }
.muted { font-size: 12px; fill: #687786; }
.sequence { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 600; fill: #17212b; }
.table-head { font-size: 10px; font-weight: 700; letter-spacing: 0.7px; fill: #526273; }
.table { font-size: 11px; fill: #263544; }
.table-mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #17212b; }
.footer { font-size: 9px; fill: #687786; }
</style>
<text x="32" y="45" class="kicker">COMPLEX-VARIANT VAXRANK RESULT</text>
<text x="32" y="78" class="title">CD109 long-read phased alleles</text>
<text x="32" y="103" class="subtitle">chr6:g.73812224C&gt;T phased with chr6:g.73818405G&gt;T | Osteosarcoma T2 | Long-read-resolved compound protein</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#fff2c2"/>
<text x="52" y="146" class="outcome" fill="#755400">NO TARGET BINDER</text>
<text x="238" y="145" class="body">Twenty-one ONT UMI groups and three exact 222-nt Q20 reads phase the alleles, but no target epitope</text><text x="238" y="162" class="body">passes the configured class-I filters.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">Two variants 6,181 bp apart cannot be assigned to one expressed molecule</text><text x="52" y="266" class="body">from independent DNA calls or site-local short reads.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="636" y="248" class="strong">Oxford Nanopore long-read RNA | T2 ONT phased interval</text>
<text x="636" y="272" class="body">21 ALT/ALT UMI groups; 3 exact full-interval Q20 reads; 0 linked Illumina reads</text>
<text x="636" y="307" class="body">Vaxrank RNA gates: </text>
<text x="771" y="307" class="strong" fill="#176b4d">PASS: LONG-READ PHASE</text>

<text x="32" y="353" class="panel-title">3  ASSEMBLED OR TRANSLATED PROTEIN</text>
<rect x="32" y="367" width="1136" height="73" rx="8" fill="#f8fafb"/>
<text x="52" y="396" class="sequence">QPMAVNISANGFGFAICQLNVVYNVKASGSSRRRRSIQNQEAFDLDVAVKENKDDLNH</text><text x="52" y="415" class="sequence">VDLNVCTSFSGPGMSG</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
<text x="52" y="505" class="panel-title">4  VACCINE-CONSTRUCT DECISION</text>
<text x="52" y="526" class="muted">No peptide selected for a vaccine construct.</text>
<text x="52" y="585" class="body">Long reads change the protein claim by linking two substitutions 207</text><text x="52" y="603" class="body">coding nucleotides apart. Vaxrank retains the negative epitope result</text><text x="52" y="621" class="body">without forcing selection.</text>

<text x="616" y="493" class="panel-title">5  TARGET EPITOPES PASSING DEFAULT FILTERS</text>
<text x="642" y="511" class="table-head">PEPTIDE</text>
<text x="786" y="511" class="table-head">ALLELE</text>
<text x="930" y="511" class="table-head">IC50 NM</text>
<text x="1022" y="511" class="table-head">RANK %</text>
<text x="1115" y="511" text-anchor="end" class="table-head">SCORE</text>
<rect x="628" y="516" width="540" height="58" rx="6" fill="#f5f8fa"/><text x="648" y="548" class="muted">No target epitope passed the configured filters.</text>

<text x="52" y="646" class="muted">No 25-mer spans both amino-acid changes; long reads prove molecular phase, while each local antigen remains independently targetable.</text>

<line x1="32" y1="690" x2="1168" y2="690" stroke="#d8e0e7"/>
<text x="32" y="714" class="footer">osteosarc.com focal variant | ONT phased-interval audit | NetMHCpan 4.2c</text>
<text x="1168" y="737" text-anchor="end" class="footer">Vaxrank 3.19.1 | research use only</text>
</svg>