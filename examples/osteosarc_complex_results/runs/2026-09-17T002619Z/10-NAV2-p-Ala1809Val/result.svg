<text x="32" y="45" class="kicker">COMPLEX-VARIANT VAXRANK RESULT</text>
<text x="32" y="78" class="title">NAV2 p.Ala1809Val</text>
<text x="32" y="103" class="subtitle">chr11:g.20080142C&gt;T | Osteosarcoma T2 | Multi-transcript RNA-supported missense</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#dff4e9"/>
<text x="52" y="146" class="outcome" fill="#176b4d">SELECTED</text>
<text x="238" y="145" class="body">Illumina RNA yields one validated 47-aa sequence compatible with two contributing transcript models and a</text><text x="238" y="162" class="body">target-bearing construct.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">The SNV maps to multiple transcript consequences; DNA alone cannot choose</text><text x="52" y="266" class="body">the RNA-contributing transcript model.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="636" y="248" class="strong">Illumina short-read RNA | T2 SARC0277; source 8fda918141cedf55</text>
<text x="636" y="272" class="body">ALT 18 | REF 16 | OTHER 0 | top protein 13</text>
<text x="636" y="298" class="body">Vaxrank RNA gates: </text>
<text x="771" y="298" class="strong" fill="#176b4d">PASS</text>

<text x="32" y="353" class="panel-title">3  ASSEMBLED OR TRANSLATED PROTEIN</text>
<rect x="32" y="367" width="1136" height="73" rx="8" fill="#f8fafb"/>
<text x="52" y="396" class="sequence">GTAQSADLRIRRQHSSDSVSSINSVTSHSSVGSNIESDSKKKKRKNW</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
<text x="52" y="505" class="panel-title">4  VACCINE-CONSTRUCT DECISION</text>
<text x="52" y="526" class="sequence">DLRIRRQHSSDSVSSINSVTSHSSV</text><text x="52" y="551" class="body">Rank score 0.012 | target epitope score 0.012</text><text x="52" y="570" class="muted">source-agnostic target epitope score</text>
<text x="52" y="585" class="body">The sequence is resolved while isoform identity remains non-unique. Both</text><text x="52" y="603" class="body">assembled transcript IDs are preserved instead of reporting one guessed</text><text x="52" y="621" class="body">source.</text>

<text x="616" y="493" class="panel-title">5  TARGET EPITOPES PASSING DEFAULT FILTERS</text>
<text x="642" y="511" class="table-head">PEPTIDE</text>
<text x="786" y="511" class="table-head">ALLELE</text>
<text x="930" y="511" class="table-head">IC50 NM</text>
<text x="1022" y="511" class="table-head">RANK %</text>
<text x="1115" y="511" text-anchor="end" class="table-head">SCORE</text>
<rect x="628" y="516" width="540" height="22" fill="#ffffff"/><text x="642" y="531" class="table-mono">NSVTSHSSV</text><text x="786" y="531" class="table">HLA-C*01:02</text><text x="930" y="531" class="table">1029.88</text><text x="1022" y="531" class="table">1.951</text><text x="1115" y="531" text-anchor="end" class="table">0.012</text>

<text x="52" y="646" class="muted">The RNA window ends before reference transcript predictions diverge, so this result does not claim unique isoform resolution.</text>

