<text x="52" y="396" class="sequence">VFKKIPLKPSPSKKFRSGSSFSRRAAPVATPALLTSHRSLGNTRHK</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
