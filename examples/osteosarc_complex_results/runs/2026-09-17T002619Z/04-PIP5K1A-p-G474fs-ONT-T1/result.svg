<text x="52" y="146" class="outcome" fill="#176b4d">SELECTED</text>
<text x="238" y="145" class="body">Long-read RNA assembly establishes an expressed frameshift protein and Vaxrank selects a supported long</text><text x="238" y="162" class="body">peptide.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">The genomic deletion predicts a frameshift, but DNA alone cannot establish</text><text x="52" y="266" class="body">the expressed haplotype, mutant protein extent, or junction-spanning peptide</text><text x="52" y="284" class="body">sequence.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
