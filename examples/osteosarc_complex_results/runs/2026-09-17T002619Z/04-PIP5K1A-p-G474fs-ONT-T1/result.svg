<text x="52" y="526" class="sequence">SSFSRRAAPVATPALLTSHRSLGNT</text><text x="52" y="551" class="body">Rank score 14.674 | target epitope score 8.472</text><text x="52" y="570" class="muted">RNA support × target epitope score</text>
<text x="52" y="585" class="body">This is the positive assembly-dependent result: RNA reconstruction</text><text x="52" y="603" class="body">changes an abstract frameshift call into a ranked vaccine candidate with</text><text x="52" y="621" class="body">multiple class-I binders.</text>

