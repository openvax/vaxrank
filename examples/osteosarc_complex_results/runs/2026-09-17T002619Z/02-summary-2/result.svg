<rect x="32" y="214" width="1136" height="46" rx="7" fill="#dff4e9"/><text x="52" y="235" class="strong">MAP2 compound frameshift haplotype</text><text x="52" y="252" class="footer">RNA-resolved compound frameshift</text><text x="420" y="244" class="body">T1 Illumina: 4 exact Q20 compound reads; T2 Illumina and ONT corroborate </text><text x="1138" y="244" text-anchor="end" class="outcome" fill="#176b4d">SELECTED</text><rect x="32" y="266" width="1136" height="46" rx="7" fill="#dff4e9"/><text x="52" y="287" class="strong">NTF3 compound p.Lys69Ser haplotype</text><text x="52" y="304" class="footer">RNA correction of isolated SNV effect</text><text x="420" y="296" class="body">Illumina and ONT reproduce AG&gt;GT; single-edit Lys→Arg is rejected </text><text x="1138" y="296" text-anchor="end" class="outcome" fill="#176b4d">SELECTED</text><rect x="32" y="318" width="1136" height="46" rx="7" fill="#fff2c2"/><text x="52" y="339" class="strong">CD109 long-read phased alleles</text><text x="52" y="356" class="footer">Long-read-resolved compound protein</text><text x="420" y="348" class="body">ONT links both alleles in 21 UMIs; Illumina links neither </text><text x="1138" y="348" text-anchor="end" class="outcome" fill="#755400">NO TARGET BINDER</text><rect x="32" y="370" width="1136" height="46" rx="7" fill="#dff4e9"/><text x="52" y="391" class="strong">ZNF436 p.Ser207Cys long-read context</text><text x="52" y="408" class="footer">Long-read-expanded antigen context</text><text x="420" y="400" class="body">ONT 49 aa; Illumina assembly 30 aa; Illumina unassembled 29 aa </text><text x="1138" y="400" text-anchor="end" class="outcome" fill="#176b4d">SELECTED</text><rect x="32" y="422" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="443" class="strong">FOXO3::STRADA/CCDC47</text><text x="52" y="460" class="footer">Cross-platform structural variant / fusion</text><text x="420" y="452" class="body">55 DNA + 31 RNA split reads across four timepoints; donor frame unresolved </text><text x="1138" y="452" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text><rect x="32" y="474" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="495" class="strong">PARD3B::CDKN2B-AS1/CDKN2B</text><text x="52" y="512" class="footer">Recurrent somatic translocation</text><text x="420" y="504" class="body">119 DNA + 48 RNA split reads; direct ONT junction includes 12 inserted nt </text><text x="1138" y="504" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text><rect x="32" y="526" width="1136" height="46" rx="7" fill="#f8e3e7"/><text x="52" y="547" class="strong">AMPH 4.3-kb internal deletion</text><text x="52" y="564" class="footer">DNA-supported intragenic structural deletion</text><text x="420" y="556" class="body">DNA-supported 4.3-kb deletion; no RNA split reads </text><text x="1138" y="556" text-anchor="end" class="outcome" fill="#7a2938">NO TRANSLATION</text>
