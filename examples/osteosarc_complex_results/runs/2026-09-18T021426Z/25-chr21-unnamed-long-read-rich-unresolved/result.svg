<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#ffffff"/>
<style>
text { font-family: Inter, Helvetica, Arial, sans-serif; }
.title { font-size: 27px; font-weight: 700; fill: #17212b; }
.subtitle { font-size: 13px; fill: #445364; }
.kicker, .panel-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #526273; }
.outcome { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.body { font-size: 12px; fill: #334252; }
.strong { font-size: 13px; font-weight: 700; fill: #17212b; }
.muted { font-size: 12px; fill: #687786; }
.sequence { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 600; fill: #17212b; }
.table-head { font-size: 10px; font-weight: 700; letter-spacing: 0.7px; fill: #526273; }
.table { font-size: 11px; fill: #263544; }
.table-mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #17212b; }
.footer { font-size: 9px; fill: #687786; }
</style>
<text x="32" y="45" class="kicker">COMPLEX-VARIANT VAXRANK RESULT</text>
<text x="32" y="78" class="title">chr21 unnamed long-read-rich junction</text>
<text x="32" y="103" class="subtitle">chr21:8397976 ↔ chr21:8442207 | Osteosarcoma T0-T3 | Long-read-dominant expressed structural junction</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#f8e3e7"/>
<text x="52" y="146" class="outcome" fill="#7a2938">NO TRANSLATION</text>
<text x="238" y="145" class="body">The junction has 32 RNA split reads, including 29 across ONT and PacBio, yet both partners are unnamed</text><text x="238" y="162" class="body">and no CDS start or frame is justified; translation is withheld.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">Two tumor-DNA split reads across T1 and T2 meet the site&#x27;s multi-sample</text><text x="52" y="266" class="body">somatic threshold, but the breakends do not identify a coding transcript.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="636" y="248" class="strong">Oxford Nanopore, PacBio, and short-read RNA | fusion-wide 43-BAM junction...</text>
<text x="636" y="272" class="body">2 tumor-DNA split reads; 32 RNA split reads; 29 long-read witnesses</text>
<text x="636" y="307" class="body">Vaxrank RNA gates: </text>
<text x="771" y="307" class="strong" fill="#7a2938">HELD OUT: UNNAMED PARTNERS / NO CDS</text>

<text x="32" y="353" class="panel-title">3  ASSEMBLED OR TRANSLATED PROTEIN</text>
<rect x="32" y="367" width="1136" height="73" rx="8" fill="#f8fafb"/>
<text x="52" y="396" class="muted">Not established</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
<text x="52" y="505" class="panel-title">4  VACCINE-CONSTRUCT DECISION</text>
<text x="52" y="526" class="muted">No peptide selected for a vaccine construct.</text>
<text x="52" y="585" class="body">This is the clearest additional long-read-dependent expression example:</text><text x="52" y="603" class="body">long reads dominate the RNA evidence, but abundant support still cannot</text><text x="52" y="621" class="body">substitute for a defensible coding model.</text>

<text x="616" y="493" class="panel-title">5  TARGET EPITOPES PASSING DEFAULT FILTERS</text>
<text x="642" y="511" class="table-head">PEPTIDE</text>
<text x="786" y="511" class="table-head">ALLELE</text>
<text x="930" y="511" class="table-head">IC50 NM</text>
<text x="1022" y="511" class="table-head">RANK %</text>
<text x="1115" y="511" text-anchor="end" class="table-head">SCORE</text>
<rect x="628" y="516" width="540" height="58" rx="6" fill="#f5f8fa"/><text x="648" y="548" class="muted">Not predicted because neither partner has an identified coding transcript or reading frame.</text>

<text x="52" y="646" class="muted">The GC-rich chr21 locus has many nearby junction calls and unnamed partners, so mapping complexity and transcript identity must be resolved before antigen construction.</text>

<line x1="32" y1="690" x2="1168" y2="690" stroke="#d8e0e7"/>
<text x="32" y="714" class="footer">osteosarc.com fusion rank 21 | cross-platform junction evidence</text>
<text x="1168" y="737" text-anchor="end" class="footer">Vaxrank 3.19.2 | research use only</text>
</svg>