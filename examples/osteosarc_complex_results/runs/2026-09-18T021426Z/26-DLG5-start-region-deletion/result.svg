<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#ffffff"/>
<style>
text { font-family: Inter, Helvetica, Arial, sans-serif; }
.title { font-size: 27px; font-weight: 700; fill: #17212b; }
.subtitle { font-size: 13px; fill: #445364; }
.kicker, .panel-title { font-size: 11px; font-weight: 700; letter-spacing: 1px; fill: #526273; }
.outcome { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
.body { font-size: 12px; fill: #334252; }
.strong { font-size: 13px; font-weight: 700; fill: #17212b; }
.muted { font-size: 12px; fill: #687786; }
.sequence { font-family: "SFMono-Regular", Consolas, monospace; font-size: 13px; font-weight: 600; fill: #17212b; }
.table-head { font-size: 10px; font-weight: 700; letter-spacing: 0.7px; fill: #526273; }
.table { font-size: 11px; fill: #263544; }
.table-mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; font-weight: 600; fill: #17212b; }
.footer { font-size: 9px; fill: #687786; }
</style>
<text x="32" y="45" class="kicker">SEQUENCING-PLATFORM COMPARISON</text>
<text x="32" y="78" class="title">DLG5 79.5-kb start-region deletion</text>
<text x="32" y="103" class="subtitle">chr10:g.77850921_77930452del | Osteosarcoma T1/T2</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#f8e3e7"/>
<text x="52" y="146" class="outcome" fill="#7a2938">NO TRANSLATION</text>
<text x="238" y="145" class="body">Long and short RNA both show canonical DLG5 expression from an intact transcript, but neither contains</text><text x="238" y="162" class="body">the somatic deletion junction; no mutant CDS or vaccine peptide is established.</text>

<text x="32" y="207" class="panel-title">DNA EVENT AND CODING MODEL</text>
<rect x="32" y="221" width="1136" height="68" rx="8" fill="#f8fafb"/>
<text x="52" y="246" class="body">The 79,531-bp deletion removes five ENST00000372391 coding exons, including the chr10:77926518-77926520 start codon. The retained lower-coordinate coding</text><text x="52" y="263" class="body">region has no annotated start after the deletion.</text>

<text x="32" y="309" class="panel-title">LONG READ</text>
<text x="616" y="309" class="panel-title">SHORT READ</text>

<rect x="32" y="318" width="552" height="236" rx="8" fill="#eef3f7"/>
<text x="52" y="347" class="strong">T1/T2 Oxford Nanopore RNA</text>
<text x="52" y="372" class="body">No deletion-junction path. Two reads in each sample span four canonical</text><text x="52" y="388" class="body">DLG5 exon junctions, linking retained and DNA-deleted regions on an</text><text x="52" y="404" class="body">intact RNA molecule.</text>
<text x="52" y="425" class="panel-title">TRANSCRIPT NUCLEOTIDE / STRUCTURE</text>
<text x="52" y="448" class="sequence">WT path: exon 77843447-77843706 -&gt; 77853354-77853537 -&gt;</text><text x="52" y="465" class="sequence">77854227-77854370 -&gt; 77856730-77856892 -&gt; 77869129-77869197</text>
<text x="52" y="507" class="panel-title">PROTEIN AND PEPTIDE SPACE</text>
<text x="52" y="530" class="sequence">Reference-spliced DLG5 only; mutant CDS not observed</text>
<text x="52" y="550" class="footer">Variant-specific 8-11mers: 0; eligible 25-aa mutant constructs: 0</text>
<rect x="616" y="318" width="552" height="236" rx="8" fill="#eef3f7"/>
<text x="636" y="347" class="strong">T1/T2 Illumina RNA</text>
<text x="636" y="372" class="body">No deletion-junction fragment. The canonical 77843706|77853354 splice has</text><text x="636" y="388" class="body">130 T1 and 51 T2 primary fragments, but short reads do not phase the full</text><text x="636" y="404" class="body">exon chain.</text>
<text x="636" y="425" class="panel-title">TRANSCRIPT NUCLEOTIDE / STRUCTURE</text>
<text x="636" y="448" class="sequence">WT local junction: ...77843706|77853354...; deletion junction</text><text x="636" y="465" class="sequence">77850921|77930452 not observed</text>
<text x="636" y="507" class="panel-title">PROTEIN AND PEPTIDE SPACE</text>
<text x="636" y="530" class="sequence">Reference-spliced DLG5 only; mutant CDS not observed</text>
<text x="636" y="550" class="footer">Variant-specific 8-11mers: 0; eligible 25-aa mutant constructs: 0</text>

<rect x="32" y="578" width="1136" height="89" rx="8" fill="#e8f3fa"/>
<text x="52" y="603" class="panel-title">VACCINE CONSEQUENCE</text>
<text x="52" y="627" class="body">ONT phases up to four canonical DLG5 exon junctions on single reads; Illumina supplies many local junction fragments. Both observations describe</text><text x="52" y="644" class="body">reference-spliced RNA, not the deletion allele, so both peptide pools remain empty.</text>
<text x="52" y="658" class="strong">No evidence-backed vaccine construct selected.</text>

<line x1="32" y1="690" x2="1168" y2="690" stroke="#d8e0e7"/>
<text x="32" y="714" class="footer">osteosarc.com DLG5 fusion evidence | matched ONT/Illumina transcript audit | Ensembl 87</text>
<text x="1168" y="737" text-anchor="end" class="footer">Vaxrank 3.19.2 | research use only</text>
</svg>