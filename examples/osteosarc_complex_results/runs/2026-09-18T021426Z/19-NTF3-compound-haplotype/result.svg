</style>
<text x="32" y="45" class="kicker">COMPLEX-VARIANT VAXRANK RESULT</text>
<text x="32" y="78" class="title">NTF3 compound p.Lys69Ser haplotype</text>
<text x="32" y="103" class="subtitle">chr12:g.5494381_5494382delinsGT | Osteosarcoma T0/T1 | RNA correction of isolated SNV effect</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#dff4e9"/>
<text x="52" y="146" class="outcome" fill="#176b4d">SELECTED</text>
<text x="238" y="145" class="body">The explicit compound allele is independently observed in Illumina and ONT RNA, passes the evidence gate,</text><text x="238" y="162" class="body">and yields a target-bearing peptide.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">Treating A&gt;G alone predicts Lys-to-Arg. RNA carries the adjacent base change</text><text x="52" y="266" class="body">too, so the expressed AG&gt;GT haplotype encodes serine.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="636" y="248" class="strong">Illumina and Oxford Nanopore RNA | explicit compound stress corpus</text>
<text x="636" y="272" class="body">4 ALT templates and 4 REF templates in the selected Illumina reconstruction</text>
<text x="636" y="307" class="body">Vaxrank RNA gates: </text>
<text x="771" y="307" class="strong" fill="#176b4d">PASS: EXPLICIT COMPOUND HAPLOTYPE</text>

<text x="32" y="353" class="panel-title">3  ASSEMBLED OR TRANSLATED PROTEIN</text>
<rect x="32" y="367" width="1136" height="73" rx="8" fill="#f8fafb"/>
<text x="52" y="396" class="sequence">NKLSKQMVDVSENYQSTLPK</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
<text x="52" y="505" class="panel-title">4  VACCINE-CONSTRUCT DECISION</text>
<text x="52" y="526" class="sequence">NKLSKQMVDVSENYQSTLPK</text><text x="52" y="551" class="body">Rank score 0.842 | target epitope score 0.842</text><text x="52" y="570" class="muted">source-agnostic target epitope score</text>
<text x="52" y="585" class="body">NTF3 is the cleanest RNA-versus-single-edit correction: the amino acid</text><text x="52" y="603" class="body">changes because the true local haplotype spans two adjacent bases.</text>

<text x="616" y="493" class="panel-title">5  TARGET EPITOPES PASSING DEFAULT FILTERS</text>
<text x="642" y="511" class="table-head">PEPTIDE</text>
<text x="786" y="511" class="table-head">ALLELE</text>
<text x="930" y="511" class="table-head">IC50 NM</text>
<text x="1022" y="511" class="table-head">RANK %</text>
<text x="1115" y="511" text-anchor="end" class="table-head">SCORE</text>
<rect x="628" y="516" width="540" height="22" fill="#ffffff"/><text x="642" y="531" class="table-mono">VSENYQSTL</text><text x="786" y="531" class="table">HLA-C*01:02</text><text x="930" y="531" class="table">171.14</text><text x="1022" y="531" class="table">0.470</text><text x="1115" y="531" text-anchor="end" class="table">0.842</text>

<text x="52" y="646" class="muted">osteosarc.com lists p.Lys69Ser but does not currently publish a protein context; the displayed window comes from the RNA reconstruction.</text>

<line x1="32" y1="690" x2="1168" y2="690" stroke="#d8e0e7"/>
<text x="32" y="714" class="footer">osteosarc.com p.Lys69Ser annotation | Isovar compound-allele corpus | NetMHCpan 4.2c</text>
<text x="1168" y="737" text-anchor="end" class="footer">Vaxrank 3.19.2 | research use only</text>
