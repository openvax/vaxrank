t x="32" y="474" width="1136" height="46" rx="7" fill="#dff4e9"/><text x="52" y="495" class="strong">KTN1 p.Leu340fs</text><text x="52" y="512" class="footer">Cross-platform frameshift with long-read construct rescue</text><text x="420" y="504" class="body">Same FYSLL tail and 20 class-I windows; ONT 29 aa / 5 construct windows versus Illumina 18 aa / 0 </text><text x="1138" y="504" text-anchor="end" class="outcome" fill="#176b4d">SELECTED</text><rect x="32" y="526" width="1136" height="46" rx="7" fill="#dff4e9"/><text x="52" y="547" class="strong">DYNC1H1 p.Val314Ile</text><text x="52" y="564" class="footer">RNA-supported missense control</text><text x="420" y="556" class="body">ONT: 48 ALT, 7 OTHER; assembly and no-assembly sequences agree </text><text x="1138" y="556" text-anchor="end" class="outcome" fill="#176b4d">SELECTED</text>
