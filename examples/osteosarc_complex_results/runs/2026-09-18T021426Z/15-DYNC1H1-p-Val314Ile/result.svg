<text x="52" y="526" class="sequence">LTLDILKHGKRFHATISFDTDTGLK</text><text x="52" y="551" class="body">Rank score 4.908 | target epitope score 4.908</text><text x="52" y="570" class="muted">source-agnostic target epitope score</text>
<text x="52" y="585" class="body">This is a concordant control. Assembly does not change the sequence, and</text><text x="52" y="603" class="body">the selected window overlaps vaccine sequences published on</text><text x="52" y="621" class="body">osteosarc.com.</text>

