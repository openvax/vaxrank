<text x="238" y="145" class="body">RNA assembly and non-assembly modes agree on the same 45-aa context; Vaxrank recovers the strong</text><text x="238" y="162" class="body">KRFHATISF-centered candidate.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">The SNV predicts p.Val314Ile, but does not by itself establish expression or</text><text x="52" y="266" class="body">the sample-specific transcript context.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
