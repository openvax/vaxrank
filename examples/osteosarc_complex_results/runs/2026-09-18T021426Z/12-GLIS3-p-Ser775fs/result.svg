<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">The 8-bp deletion predicts a new reading frame but cannot prove that the</text><text x="52" y="266" class="body">resulting transcript and mutant tail are expressed.</text>

