<text x="32" y="45" class="kicker">COMPLEX-VARIANT VAXRANK RESULT</text>
<text x="32" y="78" class="title">ZNF436 p.Ser207Cys long-read context</text>
<text x="32" y="103" class="subtitle">chr1:g.23362762G&gt;C | Osteosarcoma T1 | Long-read-expanded antigen context</text>
<rect x="32" y="122" width="1136" height="55" rx="8" fill="#dff4e9"/>
<text x="52" y="146" class="outcome" fill="#176b4d">SELECTED</text>
<text x="238" y="145" class="body">ONT reconstructs 49 aa versus 30 aa with Illumina assembly and 29 aa without it, expanding the candidate</text><text x="238" y="162" class="body">pool and yielding a selected construct.</text>

<text x="32" y="208" class="panel-title">1  DNA-ONLY INTERPRETATION</text>
<rect x="32" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="52" y="248" class="body">The SNV predicts p.Ser207Cys but says nothing about how much contiguous</text><text x="52" y="266" class="body">expressed sequence is available for antigen-window enumeration.</text>

<text x="616" y="208" class="panel-title">2  SAMPLE-SPECIFIC RNA EVIDENCE</text>
<rect x="616" y="222" width="552" height="101" rx="8" fill="#eef3f7"/>
<text x="636" y="248" class="strong">Oxford Nanopore versus Illumina RNA | matched T1 comparison</text>
<text x="636" y="272" class="body">ONT 3 ALT UMI groups; ILMN 8 ALT observations / 7 supporting templates</text>
<text x="636" y="307" class="body">Vaxrank RNA gates: </text>
<text x="771" y="307" class="strong" fill="#176b4d">PASS: LONG-READ CONTEXT</text>

<text x="32" y="353" class="panel-title">3  ASSEMBLED OR TRANSLATED PROTEIN</text>
<rect x="32" y="367" width="1136" height="73" rx="8" fill="#f8fafb"/>
<text x="52" y="396" class="sequence">QHQRTHTGERPYDCNECGKSFGRSCHLIQHQTIHTGEKPHKCNECGKSF</text>

<rect x="32" y="479" width="552" height="186" rx="8" fill="#f5f8fa"/>
<text x="52" y="505" class="panel-title">4  VACCINE-CONSTRUCT DECISION</text>
<text x="52" y="526" class="sequence">KSFGRSCHLIQHQTIHTGEKPHKCN</text><text x="52" y="551" class="body">Rank score 0.517 | target epitope score 0.517</text><text x="52" y="570" class="muted">source-agnostic target epitope score</text>
<text x="52" y="585" class="body">The mutation identity is unchanged; long reads expand the defensible</text><text x="52" y="603" class="body">flanking sequence and therefore the set of junction-overlapping long</text><text x="52" y="621" class="body">peptides Vaxrank can consider.</text>

<text x="616" y="493" class="panel-title">5  TARGET EPITOPES PASSING DEFAULT FILTERS</text>
<text x="642" y="511" class="table-head">PEPTIDE</text>
